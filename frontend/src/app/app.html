<nav style="display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #1e293b; color: white; font-family: sans-serif;">
  <h2 style="margin: 0; font-size: 18px; cursor: pointer;" routerLink="/dashboard">🏠 Gestionale Affitti</h2>

  <!-- Mostra i dati dell'utente se loggato -->
  <div *ngIf="authService.currentUser$ | async as user; else anonymousBlock" style="display: flex; align-items: center; gap: 15px;">
    <span>👤 <strong>{{ user.name }}</strong> <small>({{ user.role }})</small></span>

    <a *ngIf="authService.isLocatore()" routerLink="/create-property"
       style="background: #22c55e; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold;">
      + Pubblica Annuncio
    </a>

    <button (click)="authService.logout()"
            style="padding: 6px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Esci
    </button>
  </div>

  <ng-template #anonymousBlock>
    <div>
      <a routerLink="/login" style="color: white; text-decoration: none; font-weight: bold;">Accedi</a>
    </div>
  </ng-template>
</nav>

<main style="padding: 20px;">
  <router-outlet></router-outlet>
</main>
