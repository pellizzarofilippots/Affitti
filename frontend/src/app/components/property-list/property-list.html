<div style="max-width: 600px; margin: 0 auto; padding: 15px; font-family: system-ui, -apple-system, sans-serif;">

  <!-- Header essenziale -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h2 style="margin: 0; font-size: 20px;">I miei Immobili</h2>
      <p style="margin: 0; color: #666; font-size: 14px;">Gestione affitti attivi</p>
    </div>

    <!-- Pulsante per andare alla schermata di pubblicazione -->
    <a routerLink="/properties/new" style="background: #007bff; color: white; padding: 10px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px;">
      + Pubblica
    </a>
  </div>

  <!-- Messaggio Stato Vuoto -->
  <div *ngIf="properties().length === 0" style="text-align: center; padding: 40px 20px; background: #f9f9f9; border-radius: 12px; color: #777;">
    <p>Non hai ancora immobili o affitti attivi.</p>
    <a routerLink="/properties/new" style="color: #007bff; font-weight: bold;">Crea il tuo primo annuncio</a>
  </div>

  <!-- Lista Schede Immobili (Mobile Ready) -->
  <div style="display: flex; flex-direction: column; gap: 15px;">
    <div *ngFor="let p of properties()" style="border: 1px solid #eee; border-radius: 12px; padding: 12px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 12px; align-items: center;">

      <img [src]="p.imageUrl || 'https://via.placeholder.com/100'" style="width: 80px; height: 80px; border-radius: 8px; object-fit: cover; background: #f0f0f0;" />

      <div style="flex: 1;">
        <span [style.color]="p.status === 'RENTED' ? '#28a745' : '#007bff'" style="font-size: 11px; font-weight: bold; text-transform: uppercase;">
          {{ p.status === 'RENTED' ? '● Affittato' : '● In Vetrina' }}
        </span>
        <h4 style="margin: 2px 0 4px 0; font-size: 16px;">{{ p.title || p.address }}</h4>
        <p style="margin: 0; font-size: 13px; color: #666;">📍 {{ p.city }}</p>
        <p style="margin: 4px 0 0 0; font-weight: bold; font-size: 15px; color: #333;">{{ p.monthlyRent }} € <span style="font-size: 11px; font-weight: normal; color: #777;">/mese</span></p>
      </div>

    </div>
  </div>

</div>
